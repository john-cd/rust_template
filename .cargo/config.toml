# Configure shared build tools and the local compiler cache.
[build]
rustc-wrapper = "sccache"

[env]
# Shared cache across main checkout and worktrees.
# SCCACHE_DIR = "D:/code/rust_template/.sccache"
# SCCACHE_BASEDIRS = "D:/code/rust_template;D:/code/rust_template/.worktrees/a;D:/code/rust_template/.worktrees/b;D:/code/rust_template/.worktrees/c"
SCCACHE_CACHE_SIZE = "35G"

[term]
quiet = true

[net]
retry = 2

[alias]
tools = "run --locked --package tools --"

# Fast local iteration.
[profile.dev]
debug = 0 # If you need debugger support, use "line-tables-only"
incremental = false # Required for sccache

# Compile dependencies with full optimization while keeping workspace crates fast to rebuild.
[profile.dev.package."*"]
debug = 0
opt-level = 1

# Keep full debug information available for local debugging sessions.
[profile.debug]
inherits = "dev"
debug = 2

# Same settings than "dev" for sccache reuse.
[profile.debug.package."*"]
debug = 0
opt-level = 1

[profile.test]
inherits = "dev"

# Same settings than "dev" for sccache reuse.
[profile.test.package."*"]
debug = 0
opt-level = 1

# A CI build profile with the same quick compile settings as development.
[profile.ci]
inherits = "dev"

# Optimized developer tools without changing the standard release profile.
[profile.tools]
inherits = "dev"
opt-level = 2

# Cargo defaults reference (Cargo 1.99.1). These values are intentionally comments only.
# [build]
# target-dir = "target"              # workspace-root target directory
# incremental = <profile default>    # profile-dependent; false in CI when CI is set
# rustc-wrapper = <unset>            # invoke rustc directly
#
# [env]
# CARGO_TARGET_DIR = <unset>
# CARGO_BUILD_BUILD_DIR = <unset>
# SCCACHE_BASEDIRS = <unset>
# <other variables> = <unset>        # Cargo does not add project-specific environment variables
