# cargo-nextest configuration: https://nexte.st/book/configuration.html

[profile.default]
# Local runs stop on the first failure and keep successful test output quiet.
fail-fast = true
retries = 0
slow-timeout = { period = "60s", terminate-after = 2 }
status-level = "fail"
final-status-level = "flaky"
failure-output = "final"
success-output = "never"

[profile.ci]
# CI retries once and continues through failures to collect a complete report.
inherits = "default"
fail-fast = false
retries = 1
status-level = "skip"
final-status-level = "skip"
failure-output = "immediate-final"

[profile.ci.junit]
path = "junit.xml"
report-name = "rust-template-ci"
