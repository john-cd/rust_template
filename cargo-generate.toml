[template]
cargo_generate_version = ">=0.24.0"
# Match generated output paths; the .liquid suffix is removed before this filter
# is applied. GitHub Actions expressions and Zola template braces stay untouched.
include = [
  "Cargo.toml",
  "Cargo.lock",
  "LICENSE-MIT",
  "README.md",
  "CONTRIBUTING.md",
  "PROJECT.md",
  "Makefile.toml",
  ".devcontainer/.env",
  ".devcontainer/.env.example",
  ".devcontainer/devcontainer.json",
  "crates/my_cli/Cargo.toml",
  "crates/my_lib/Cargo.toml",
  "crates/my_cli/src/cli.rs",
  "crates/my_cli/src/lib.rs",
  "crates/my_cli/src/logging.rs",
  "crates/my_cli/src/main.rs",
  "crates/my_cli/tests/cli.rs",
  "crates/my_lib/src/greeting.rs",
  "crates/my_lib/src/config/mod.rs",
  "crates/my_lib/src/atomic_file.rs",
  "crates/my_lib/tests/greeting.rs",
  "crates/my_lib/examples/greeting.rs",
  "crates/my_lib/benches/greeting.rs",
  "crates/**/*.md",
  "docs/**/*.md",
  "website/content/**/*.md",
]
# Keep local build output and auxiliary worktrees out of generated projects.
ignore = [".worktrees", "target", ".lycheecache"]

# Keep setup instructions generated from the same version choices in CONTRIBUTING.md and README.md.
# Defaults match the pins in .devcontainer/.env.liquid and the local toolchain files.
[placeholders.rust_version]
prompt = "Rust toolchain version"
default = "1.99.1"
type = "string"

[placeholders.rustfmt_version]
prompt = "Rustfmt toolchain version"
default = "nightly-2026-11-06"
type = "string"

[placeholders.cargo_binstall_version]
prompt = "cargo-binstall version"
default = "1.26.2"
type = "string"

[placeholders.cargo_make_version]
prompt = "cargo-make version"
default = "0.37.24"
type = "string"

[placeholders.cargo_nextest_version]
prompt = "cargo-nextest version"
default = "0.9.148"
type = "string"

[placeholders.cargo_deny_version]
prompt = "cargo-deny version"
default = "0.20.2"
type = "string"

[placeholders.dprint_version]
prompt = "dprint version"
default = "0.64.3"
type = "string"

[placeholders.lychee_version]
prompt = "lychee version"
default = "0.24.2"
type = "string"

[placeholders.sccache_version]
prompt = "sccache version"
default = "0.19.0"
type = "string"

[placeholders.typos_version]
prompt = "typos-cli version"
default = "1.52.0"
type = "string"

[placeholders.zola_version]
prompt = "Zola version"
default = "0.23.6"
type = "string"
