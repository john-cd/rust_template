name: Container smoke

# Keep this workflow manual because building images is slower than the regular validation job.
on:
  workflow_dispatch:

permissions:
  contents: read

# Verify the development image's pinned tools separately from the production image's CLI entry point.
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build development image
        # Build the standalone editor environment used by VS Code.
        run: docker compose --env-file .devcontainer/.env -f .devcontainer/compose.devcontainer.yaml build devcontainer
      - name: Smoke test pinned development tools
        # Confirm representative tools are present and launchable inside the built image.
        run: docker compose --env-file .devcontainer/.env -f .devcontainer/compose.devcontainer.yaml run --rm --no-deps devcontainer bash -lc 'rustc --version && cargo nextest --version && sccache --version && dprint --version && lychee --version && typos --version'
      - name: Build production image
        # Build the production service from its standalone Compose file.
        run: docker compose --env-file .devcontainer/.env -f .devcontainer/compose.production.yaml build app
      - name: Smoke test production executable
        # Verify the image entry point starts and returns its help text.
        run: docker compose --env-file .devcontainer/.env -f .devcontainer/compose.production.yaml run --rm app --help
