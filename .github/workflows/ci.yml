# TODO Reviewed ??-??-????
# Validate Rust on the supported operating systems and run repository-specific checks on Linux.

name: Rust CI

# Run for contributions, direct updates, manual checks, and a weekly dependency/tooling sweep.
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 9 * * 1"

# Keep CI read-only; workflows do not need repository write access.
permissions:
  contents: read

# Cancel stale runs for the same branch or pull request after a newer commit arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Compile, lint, and test the workspace on each supported runner platform.
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    strategy:
      # Let every OS finish so platform-specific failures are visible together.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load shared tool versions
        # Read the same pins used by local setup and container development.
        shell: bash
        run: |
          set -a
          source .devcontainer/.env
          set +a
          workspace="$GITHUB_WORKSPACE"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            workspace="${workspace//\\//}"
            separator=';'
          else
            separator=':'
          fi
          {
            printf 'RUSTUP_TOOLCHAIN=%s\n' "$RUST_VERSION"
            printf 'RUST_VERSION=%s\n' "$RUST_VERSION"
            printf 'RUSTFMT_VERSION=%s\n' "$RUSTFMT_VERSION"
            printf 'CARGO_MAKE_VERSION=%s\n' "$CARGO_MAKE_VERSION"
            printf 'CARGO_BINSTALL_VERSION=%s\n' "$CARGO_BINSTALL_VERSION"
            printf 'CARGO_NEXTEST_VERSION=%s\n' "$CARGO_NEXTEST_VERSION"
            printf 'CARGO_DENY_VERSION=%s\n' "$CARGO_DENY_VERSION"
            printf 'SCCACHE_VERSION=%s\n' "$SCCACHE_VERSION"
            printf 'SCCACHE_BASEDIRS=%s%s%s/.worktrees/a%s%s/.worktrees/b%s%s/.worktrees/c\n' "$workspace" "$separator" "$workspace" "$separator" "$workspace" "$separator" "$workspace"
          } >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy,rustfmt
        shell: bash
      - name: Check minimum Rust version
        # Compile against the advertised MSRV without the main toolchain's sccache wrapper.
        env:
          RUSTC_WRAPPER: ""
        run: rustup toolchain install 1.98.1 --profile minimal && cargo +1.98.1 check --workspace --all-targets --locked
        shell: bash

      - name: Install Rust formatter toolchain
        run: rustup toolchain install "$RUSTFMT_VERSION" --profile minimal --component rustfmt
        shell: bash

      - name: Configure sccache with GitHub Actions cache
        # Share compiler artifacts between CI runs while isolating cache use per workflow job.
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v${{ env.SCCACHE_VERSION }}"

      - name: Install cargo-binstall
        run: cargo install --locked cargo-binstall --version "$CARGO_BINSTALL_VERSION"
        shell: bash
      - name: Install development tools
        # Install pinned prebuilt tools used by the Rust task aliases.
        run: cargo binstall --locked --no-confirm "cargo-make@$CARGO_MAKE_VERSION" "cargo-nextest@$CARGO_NEXTEST_VERSION" "cargo-deny@$CARGO_DENY_VERSION"
        shell: bash

      - name: Check Rust formatting
        run: cargo +"$RUSTFMT_VERSION" fmt --all -- --check
        shell: bash
      - run: cargo make ci-rust
      - name: Upload nextest report
        # Preserve the JUnit report even when validation fails, when one was produced.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nextest-${{ matrix.os }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore

  # Check docs, repository formatting, and container configuration.
  documentation:
    name: Documentation and repository formatting
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load shared tool versions
        shell: bash
        run: |
          set -a
          source .devcontainer/.env
          set +a
          formatter_channel="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rustfmt-toolchain.toml)"
          test "$formatter_channel" = "$RUSTFMT_VERSION"
          grep -qF "value = \"$RUSTFMT_VERSION\"" Makefile.toml
          {
            printf 'RUST_VERSION=%s\n' "$RUST_VERSION"
            printf 'RUSTFMT_VERSION=%s\n' "$RUSTFMT_VERSION"
            printf 'CARGO_MAKE_VERSION=%s\n' "$CARGO_MAKE_VERSION"
            printf 'CARGO_BINSTALL_VERSION=%s\n' "$CARGO_BINSTALL_VERSION"
            printf 'DPRINT_VERSION=%s\n' "$DPRINT_VERSION"
            printf 'LYCHEE_VERSION=%s\n' "$LYCHEE_VERSION"
            printf 'TYPOS_VERSION=%s\n' "$TYPOS_VERSION"
            printf 'ZOLA_VERSION=%s\n' "$ZOLA_VERSION"
            printf 'ZIZMOR_VERSION=%s\n' "$ZIZMOR_VERSION"
          } >> "$GITHUB_ENV"
      - name: Install project Rust toolchain
        run: rustup toolchain install "$RUST_VERSION" --profile minimal
        shell: bash
      - name: Install Rust formatter toolchain
        run: rustup toolchain install "$RUSTFMT_VERSION" --profile minimal --component rustfmt
        shell: bash
      - name: Install cargo-binstall
        run: cargo install --locked cargo-binstall --version "$CARGO_BINSTALL_VERSION"
        shell: bash
      - name: Install documentation tools
        run: cargo binstall --locked --no-confirm "cargo-make@$CARGO_MAKE_VERSION" "dprint@$DPRINT_VERSION" "lychee@$LYCHEE_VERSION" "typos-cli@$TYPOS_VERSION" "zizmor@$ZIZMOR_VERSION"
        shell: bash
      - name: Install Zola
        run: bash scripts/install-zola.sh "$ZOLA_VERSION" "$HOME/.cargo/bin"
        shell: bash
      - name: Install cargo-generate
        run: cargo binstall --locked --no-confirm cargo-generate@0.24.0
        shell: bash
      - name: Smoke test generated workspace
        # Exercise cargo-generate outside the checkout so templates cannot hide self-containment errors.
        run: |
          project_name=workspace-smoke-app
          generated_workspace="$RUNNER_TEMP/$project_name"
          echo "Template revision:"
          git rev-parse HEAD
          echo "Pinned project toolchain: $RUST_VERSION"
          cargo generate --path . --name "$project_name" --destination "$RUNNER_TEMP" --silent --vcs none
          test -d "$generated_workspace"
          test "$generated_workspace" != "$GITHUB_WORKSPACE"
          case "$generated_workspace/" in
            "$GITHUB_WORKSPACE/"*)
              echo "Generated workspace must stay outside the source checkout" >&2
              exit 1
              ;;
          esac
          grep -qx "# $project_name" "$generated_workspace/PROJECT.md"
          test ! -e "$generated_workspace/.worktrees"
          (
            cd "$generated_workspace"
            test "$PWD" = "$generated_workspace"
            rustc --version --verbose
            cargo --version
            cargo metadata --manifest-path "$generated_workspace/Cargo.toml" --format-version 1 --locked > /dev/null
            cargo check --workspace --all-targets --all-features --locked --profile ci
            cargo test --workspace --all-targets --all-features --locked --profile ci
            cargo test --workspace --doc --all-features --locked --profile ci
            zola --root "$generated_workspace/website" check
          )
        shell: bash
      # Keep documentation and repository formatting checks out of the OS matrix.
      - run: cargo make format-check
      - run: cargo make typos
      - run: cargo make links
      - name: Validate GitHub Actions workflow
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/ci.yml
      - run: cargo make zizmor
      - name: Validate devcontainer Compose configuration
        run: |
          docker compose --env-file .devcontainer/.env -f .devcontainer/compose.yaml --profile production config --quiet
          docker compose --env-file .devcontainer/.env -f .devcontainer/compose.yaml -f .devcontainer/compose.override.yaml config --quiet
      - run: cargo make website-check
      - run: cargo make website-build
