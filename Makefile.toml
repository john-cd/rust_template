# TODO Reviewed ??-??-????
[env]
CARGO_TERM_QUIET = "true"
RUSTFMT_TOOLCHAIN = { value = "nightly-2026-10-22", condition = { env_not_set = [
  "RUSTFMT_TOOLCHAIN",
] } }

[config]
default_to_workspace = false
skip_core_tasks = true

[tasks.default]
description = "Show available project tasks"
category = "Workspace"
command = "cargo"
args = ["make", "--list-all-steps"]

[tasks.pre]
description = "Run formatting, workspace checks, and Clippy"
category = "Workspace"
dependencies = ["fmt", "format-check", "check", "clippy"]

[tasks.l]
alias = "clippy"
category = "Quality"

[tasks.fmt]
description = "Check Rust formatting"
category = "Formatting"
script_runner = "@duckscript"
script = '''
toolchain = get_env RUSTFMT_TOOLCHAIN
exec --fail-on-error rustup run ${toolchain} cargo --quiet fmt --all -- --quiet --check
'''

[tasks.check]
description = "Check all workspace targets"
category = "Build"
command = "cargo"
args = [
  "--quiet",
  "check",
  "--workspace",
  "--all-targets",
  "--all-features",
  "--locked",
  "--profile",
  "ci",
]

[tasks.build]
description = "Build all workspace targets and features"
category = "Build"
command = "cargo"
args = [
  "--quiet",
  "build",
  "--workspace",
  "--all-targets",
  "--all-features",
  "--locked",
  "--profile",
  "ci",
]

[tasks.clippy]
description = "Run Clippy across all workspace targets"
category = "Quality"
command = "cargo"
args = [
  "clippy",
  "--quiet",
  "--workspace",
  "--all-targets",
  "--all-features",
  "--locked",
  "--profile",
  "ci",
  "--",
  "-D",
  "warnings",
]

[tasks.test]
description = "Run tests with cargo-nextest"
category = "Testing"
command = "cargo"
args = [
  "nextest",
  "run",
  "--workspace",
  "--all-targets",
  "--all-features",
  "--locked",
  "--profile",
  "ci",
  "--cargo-profile",
  "ci",
  "--cargo-quiet",
]

[tasks.doctest]
description = "Run documentation tests"
category = "Testing"
command = "cargo"
args = ["--quiet", "test", "--workspace", "--doc", "--all-features", "--locked", "--profile", "ci"]

[tasks.test-cargo]
description = "Run workspace tests with Cargo when nextest is unavailable"
category = "Testing"
command = "cargo"
args = ["test", "--workspace", "--all-targets", "--all-features", "--locked", "--profile", "ci"]

[tasks.hooks]
description = "Run optional repository hooks (requires prek 0.5.6 or newer)"
category = "Quality"
command = "prek"
args = ["run", "--all-files"]

[tasks.deny]
description = "Check dependency advisories, licenses, duplicates, and sources"
category = "Quality"
command = "cargo"
args = ["--quiet", "deny", "check"]

[tasks.ci]
description = "Run the local CI checks (requires cargo-nextest and cargo-deny)"
category = "CI"
dependencies = [
  "pre",
  "build",
  "test",
  "doctest",
  "doc",
  "deny",
  "links",
  "website-check",
  "website-build",
]

[tasks.ci-rust]
description = "Run the Rust build, lint, test, documentation, and dependency checks"
category = "CI"
dependencies = ["check", "build", "clippy", "test", "doctest", "doc", "deny"]

[tasks.format]
description = "Format Rust, documentation, and configuration"
category = "Formatting"
dependencies = ["format-rust", "format-files"]

[tasks.format-rust]
category = "Formatting"
script_runner = "@duckscript"
script = '''
toolchain = get_env RUSTFMT_TOOLCHAIN
exec --fail-on-error rustup run ${toolchain} cargo --quiet fmt --all -- --quiet
'''

[tasks.format-files]
category = "Formatting"
command = "dprint"
args = ["fmt", "--log-level=error"]

[tasks.format-check]
category = "Formatting"
command = "dprint"
args = ["check", "--log-level=error"]

[tasks.doc]
description = "Build workspace API documentation with warnings denied"
category = "Documentation"
command = "cargo"
args = ["--quiet", "doc", "--workspace", "--all-features", "--no-deps", "--locked"]
env = { RUSTDOCFLAGS = "-D warnings" }

[tasks.links]
description = "Check local Markdown links without network requests"
category = "Documentation"
command = "lychee"
args = [
  "--offline",
  "--quiet",
  "--config",
  "lychee.toml",
  "*.md",
  "crates/**/*.md",
  "tools/**/*.md",
  "docs/**/*.md",
  "scripts/**/*.md",
  "website/README.md",
]

[tasks.links-online]
description = "Check local and external documentation links"
category = "Documentation"
command = "lychee"
args = [
  "--quiet",
  "--config",
  "lychee.toml",
  "*.md",
  "crates/**/*.md",
  "tools/**/*.md",
  "docs/**/*.md",
  "scripts/**/*.md",
  "website/README.md",
]

[tasks.website-check]
category = "Website"
command = "zola"
args = ["--root", "website", "check"]
env = { RUST_LOG = "error" }

[tasks.website-build]
category = "Website"
command = "zola"
args = ["--root", "website", "build"]
env = { RUST_LOG = "error" }

[tasks.website-serve]
category = "Website"
command = "zola"
args = ["--root", "website", "serve", "--interface", "0.0.0.0"]
env = { RUST_LOG = "error" }
