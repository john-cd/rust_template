# TODO Reviewed ??-??-????

env_scripts = ['''
#!@duckscript
fn <scope> root_default
    value = get_env ${1}
    empty = is_empty ${value}
    if ${empty}
        value = set ${2}
    end
    set_env ${1} ${value}
    return ${value}
end

checkout = get_env CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY
empty = is_empty ${checkout}
if ${empty}
    checkout = get_env CARGO_MAKE_WORKING_DIRECTORY
end
checkout = replace ${checkout} \\ /
parent = dirname ${checkout}
parent_name = basename ${parent}
slot = set main
main_repo = set ${checkout}
if eq ${parent_name} .worktrees
    slot = basename ${checkout}
    main_repo = dirname ${parent}
end
override = get_env CODE_WORKTREE_SLOT
empty = is_empty ${override}
if not ${empty}
    slot = set ${override}
end
allowed = split "main a b c" " "
valid = array_contains ${allowed} ${slot}
if eq ${valid} false
    trigger_error "Invalid rust_template worktree slot: ${slot}"
end
set_env CODE_WORKTREE_SLOT ${slot}

windows = is_windows
if ${windows}
    target_root = root_default CARGO_TARGET_ROOT D:/target
    build_root = root_default CARGO_BUILD_ROOT C:/code_build
    project = basename ${main_repo}
    target = get_env CARGO_TARGET_DIR
    empty = is_empty ${target}
    if ${empty}
        set_env CARGO_TARGET_DIR "${target_root}/${project}/${slot}"
    end
    build = get_env CARGO_BUILD_BUILD_DIR
    empty = is_empty ${build}
    if ${empty}
        set_env CARGO_BUILD_BUILD_DIR "${build_root}/${project}/${slot}"
    end
end
''']

# =============================================================================
# Environment and Cargo Make defaults
# =============================================================================

# Explicit environment variables take precedence over these shared defaults.
[env]
RUSTFMT_TOOLCHAIN = { value = "nightly-2026-11-06", condition = { env_not_set = [
  "RUSTFMT_TOOLCHAIN",
] } }

[config]
default_to_workspace = false
skip_core_tasks = true

# =============================================================================
# Workspace
# =============================================================================

[tasks.default]
description = "Show available project tasks"
category = "Workspace"
command = "cargo"
args = ["make", "--list-all-steps"]

[tasks.pre]
alias = "check-all"

[tasks.ca]
alias = "check-all"

[tasks.check-all]
description = "Run all checks without modifying files: format, lint, check, test"
category = "Workspace"
dependencies = ["format-check", "lint-check", "check", "test"]

[tasks.p]
alias = "prep"

[tasks.prep]
description = "Before committing: format everything, lint with autofix, then run all checks"
category = "Workspace"
dependencies = ["format-all", "lint", "check-all"]

# =============================================================================
# Formatting
# =============================================================================

[tasks.f]
alias = "format"
category = "Formatting"

[tasks.format]
description = "Format Rust, documentation, and configuration"
category = "Formatting"
dependencies = ["format-rust", "format-files"]

[tasks.fa]
alias = "format-all"

[tasks.format-all]
description = "Format everything (Rust, documentation, configuration)"
category = "Formatting"
dependencies = ["format"]

[tasks.fc]
alias = "format-check"
category = "Formatting"

[tasks.format-check]
description = "Check Rust and repository formatting"
category = "Formatting"
dependencies = ["format-rust-check", "format-files-check"]

[tasks.format-rust]
category = "Formatting"
script_runner = "@duckscript"
script = '''
toolchain = get_env RUSTFMT_TOOLCHAIN
exec --fail-on-error rustup run ${toolchain} cargo --quiet fmt --all -- --quiet
'''

[tasks.format-rust-check]
description = "Check Rust formatting"
category = "Formatting"
script_runner = "@duckscript"
script = '''
toolchain = get_env RUSTFMT_TOOLCHAIN
exec --fail-on-error rustup run ${toolchain} cargo --quiet fmt --all -- --quiet --check
'''

[tasks.format-files]
category = "Formatting"
command = "dprint"
args = ["fmt", "--log-level=error"]

[tasks.format-files-check]
category = "Formatting"
command = "dprint"
args = ["check", "--log-level=error"]

# =============================================================================
# Build
# =============================================================================

[tasks.c]
alias = "check"
category = "Build"

[tasks.check]
description = "Check all workspace targets"
category = "Build"
command = "cargo"
args = [
  "--quiet",
  "check",
  "--workspace",
  "--all-targets",
  "--all-features",
  "--locked",
  "--profile",
  "ci",
]

[tasks.b]
alias = "build"
category = "Build"

[tasks.build]
description = "Build all workspace targets and features"
category = "Build"
command = "cargo"
args = [
  "--quiet",
  "build",
  "--workspace",
  "--all-targets",
  "--all-features",
  "--locked",
  "--profile",
  "ci",
]

[tasks.br]
alias = "build-release"

[tasks.release]
alias = "build-release"

[tasks.build-release]
description = "Build the workspace in release mode"
category = "Build"
command = "cargo"
args = ["build", "--workspace", "--all-targets", "--all-features", "--locked", "--release"]

[tasks.cl]
alias = "clean"

[tasks.clean]
description = "Remove build artifacts"
category = "Build"
command = "cargo"
args = ["clean"]

[tasks.u]
alias = "update"

[tasks.update]
description = "Update dependencies in Cargo.lock"
category = "Build"
command = "cargo"
args = ["update"]

[tasks.build-env]
description = "Show effective Cargo build and cache environment"
category = "Build"
script_runner = "@duckscript"
script = '''
slot = get_env CODE_WORKTREE_SLOT
target = get_env CARGO_TARGET_DIR
build = get_env CARGO_BUILD_BUILD_DIR
cache = get_env SCCACHE_DIR
bases = get_env SCCACHE_BASEDIRS
echo CODE_WORKTREE_SLOT=${slot}
echo CARGO_TARGET_DIR=${target}
echo CARGO_BUILD_BUILD_DIR=${build}
echo SCCACHE_DIR=${cache}
echo SCCACHE_BASEDIRS=${bases}
'''

# =============================================================================
# Run
# =============================================================================

[tasks.r]
alias = "run"
category = "Run"

[tasks.run]
description = "Run the sample CLI"
category = "Run"
command = "cargo"
args = ["run", "--locked", "--"]

# =============================================================================
# Quality
# =============================================================================

[tasks.lc]
alias = "lint-check"
category = "Quality"

[tasks.clippy]
alias = "lint-check"

[tasks.lint-check]
description = "Run Clippy across all workspace targets (no changes)"
category = "Quality"
command = "cargo"
args = [
  "clippy",
  "--quiet",
  "--workspace",
  "--all-targets",
  "--all-features",
  "--locked",
  "--profile",
  "ci",
  "--",
  "-D",
  "warnings",
]

[tasks.fix]
description = "Apply compiler suggestions to the workspace"
category = "Quality"
command = "cargo"
args = ["fix", "--workspace", "--all-targets", "--all-features", "--locked"]

[tasks.l]
alias = "lint"

[tasks.lf]
alias = "lint"

[tasks.lint-fix]
alias = "lint"

[tasks.lint]
description = "Lint with autofix: apply Clippy suggestions to the workspace"
category = "Quality"
command = "cargo"
args = [
  "clippy",
  "--fix",
  "--allow-dirty",
  "--allow-staged",
  "--workspace",
  "--all-targets",
  "--all-features",
  "--locked",
]

[tasks.la]
alias = "lint-all"

[tasks.lint-all]
description = "Lint with autofix, plus workflow security audit"
category = "Quality"
dependencies = ["lint", "zizmor"]

[tasks.hooks]
description = "Run optional repository hooks (requires prek 0.5.6 or newer)"
category = "Quality"
command = "prek"
args = ["run", "--all-files"]

[tasks.hi]
alias = "hooks-install"

[tasks.hr]
alias = "hooks-run"

[tasks.hooks-install]
description = "Install prek Git hooks"
category = "Quality"
command = "prek"
args = ["install"]

[tasks.hooks-run]
description = "Run prek against staged files"
category = "Quality"
command = "prek"
args = ["run"]

[tasks.de]
alias = "deny"

[tasks.deny]
description = "Check dependency advisories, licenses, duplicates, and sources"
category = "Quality"
command = "cargo"
args = ["--quiet", "deny", "check"]

[tasks.machete]
description = "Report potentially unused dependencies for review"
category = "Quality"
command = "cargo"
args = ["machete"]

[tasks.typos]
description = "Check maintained files for spelling mistakes"
category = "Quality"
command = "typos"

[tasks.zizmor]
description = "Audit GitHub Actions workflows for security issues"
category = "Quality"
command = "zizmor"
args = ["--min-severity", "high", ".github/workflows"]

# =============================================================================
# Testing
# =============================================================================

[tasks.t]
alias = "test"
category = "Testing"

[tasks.test]
description = "Run tests with cargo-nextest"
category = "Testing"
command = "cargo"
args = [
  "nextest",
  "run",
  "--workspace",
  "--all-targets",
  "--all-features",
  "--locked",
  "--profile",
  "ci",
  "--cargo-profile",
  "ci",
  "--cargo-quiet",
]

[tasks.ta]
alias = "test-all"

[tasks.test-all]
description = "Run all tests: nextest plus documentation tests"
category = "Testing"
dependencies = ["test", "doctest"]

[tasks.test-cargo]
description = "Run workspace tests with Cargo when nextest is unavailable"
category = "Testing"
command = "cargo"
args = ["test", "--workspace", "--all-targets", "--all-features", "--locked", "--profile", "ci"]

[tasks.doctest]
description = "Run documentation tests"
category = "Testing"
command = "cargo"
args = ["--quiet", "test", "--workspace", "--doc", "--all-features", "--locked", "--profile", "ci"]

[tasks.bench]
description = "Run workspace benchmarks"
category = "Testing"
command = "cargo"
args = ["bench", "--workspace", "--all-features", "--locked"]

[tasks.bench-check]
description = "Compile workspace benchmarks without running them"
category = "Testing"
command = "cargo"
args = ["bench", "--workspace", "--all-features", "--locked", "--no-run"]

[tasks.coverage]
description = "Measure workspace test coverage with LLVM"
category = "Testing"
command = "cargo"
args = ["llvm-cov", "--workspace", "--all-features", "--locked"]

[tasks.coverage-html]
description = "Run tests and generate an HTML coverage report"
category = "Testing"
command = "cargo"
args = ["llvm-cov", "--workspace", "--all-features", "--locked", "--html"]

# =============================================================================
# Documentation
# =============================================================================

[tasks.d]
alias = "doc"

[tasks.doc]
description = "Build workspace API documentation with warnings denied"
category = "Documentation"
command = "cargo"
args = ["--quiet", "doc", "--workspace", "--all-features", "--no-deps", "--locked"]
env = { RUSTDOCFLAGS = "-D warnings" }

[tasks.links]
description = "Check local Markdown links without network requests"
category = "Documentation"
command = "lychee"
args = [
  "--offline",
  "--quiet",
  "--config",
  "lychee.toml",
  "*.md",
  "crates/**/*.md",
  "tools/**/*.md",
  "docs/**/*.md",
  "scripts/**/*.md",
  "website/README.md",
]

[tasks.links-online]
description = "Check local and external documentation links"
category = "Documentation"
command = "lychee"
args = [
  "--quiet",
  "--config",
  "lychee.toml",
  "*.md",
  "crates/**/*.md",
  "tools/**/*.md",
  "docs/**/*.md",
  "scripts/**/*.md",
  "website/README.md",
]

# =============================================================================
# Docker
# =============================================================================

[tasks.docker-build-dev]
description = "Build the development container image"
category = "Docker"
command = "docker"
args = [
  "compose",
  "--env-file",
  ".devcontainer/.env",
  "-f",
  ".devcontainer/compose.devcontainer.yaml",
  "build",
  "devcontainer",
]

[tasks.docker-build-prod]
description = "Build the production container image"
category = "Docker"
command = "docker"
args = [
  "compose",
  "--env-file",
  ".devcontainer/.env",
  "-f",
  ".devcontainer/compose.production.yaml",
  "build",
  "app",
]

# =============================================================================
# Website
# =============================================================================

[tasks.website-check]
category = "Website"
command = "zola"
args = ["--root", "website", "check"]
env = { RUST_LOG = "error" }

[tasks.website-build]
category = "Website"
command = "zola"
args = ["--root", "website", "build"]
env = { RUST_LOG = "error" }

[tasks.web]
alias = "website-serve"

[tasks.s]
alias = "website-serve"

[tasks.serve]
alias = "website-serve"

[tasks.website-serve]
category = "Website"
command = "zola"
args = ["--root", "website", "serve", "--interface", "0.0.0.0"]
env = { RUST_LOG = "error" }

# =============================================================================
# CI
# =============================================================================

[tasks.ci]
description = "Run the local CI checks (requires cargo-nextest and cargo-deny)"
category = "CI"
dependencies = [
  "format-check",
  "lint-check",
  "check",
  "build",
  "test",
  "doctest",
  "doc",
  "deny",
  "typos",
  "links",
  "website-check",
  "website-build",
]

[tasks.ci-rust]
description = "Run the Rust build, lint, test, documentation, and dependency checks"
category = "CI"
dependencies = ["check", "build", "lint-check", "test", "doctest", "doc", "deny"]
