# Adapted from the maintained-documentation link policy used by sibling Rust workspaces.
# Share these link-check settings between local tasks and CI.
# Cache URL results between runs in `.lycheecache`.
cache = true
# Check both heading anchors and text fragments in links.
include_fragments = "full"
# Skip links inside code examples; check links in documentation prose.
include_verbatim = false
# Bound simultaneous link checks so large docs sets do not overload hosts.
max_concurrency = 8
# Retry a failed request up to two times before reporting it.
max_retries = 2
# Keep output suitable for non-interactive terminals and CI.
no_progress = true
# Stop waiting for an individual website response after 20 seconds.
timeout = 20

# `exclude_path` skips input files and directories before lychee extracts links.
# Its entries are regular expressions over paths; they do not filter URLs inside scanned files.
# Use `exclude` (or `.lycheeignore`) when a URL itself should be ignored.
exclude_path = [
  # Match these whole directory names anywhere in a path, including their descendants.
  "(^|/)(target|build|node_modules|\\.worktrees)(/|$)",
  # Zola checks content references and links generated by its templates separately.
  "(^|/)website/(public|templates|content)(/|$)",
]
