# Command-line application crate; shared package metadata and lints come from the workspace.
[package]
# Package name used by Cargo commands and executable metadata.
name = "my_cli"
# Inherit release and compiler policy from the root; command-line crates add their own category.
version.workspace = true
categories = ["command-line-utilities"]
# Inherit the language edition, discovery keywords, license, publish policy, and MSRV from the root.
edition.workspace = true
keywords.workspace = true
license.workspace = true
publish.workspace = true
# Use this crate's README as its package description page.
readme = "README.md"
rust-version.workspace = true
# Keep a package-specific summary for generated docs and package metadata.
description = "Starter command-line application for a Rust workspace"

# Clap parses arguments, my_lib provides reusable behavior, and tracing emits diagnostics.
[dependencies]
clap.workspace = true
my_lib.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true

[lints]
# Apply the workspace's Rust, rustdoc, and Clippy rules to this crate.
workspace = true
