# Reusable library crate; workspace metadata and lint settings are inherited from the root.
[package]
# Package name used by Cargo commands and dependency declarations.
name = "my_lib"
# Inherit release and compiler policy; categories describe this library package specifically.
version.workspace = true
categories.workspace = true
# Inherit language edition, discovery keywords, license, publish policy, and MSRV from the root.
edition.workspace = true
keywords.workspace = true
license.workspace = true
publish.workspace = true
# Use this crate's README as its package description page.
readme = "README.md"
rust-version.workspace = true
description = "Starter library crate for a Rust workspace"

# Runtime dependencies support configuration, serialization, and typed errors.
[dependencies]
# Layered configuration system for Rust applications.
config.workspace = true
# A generic serialization/deserialization framework
serde.workspace = true
# Derives standard Error implementations for custom Rust error types.
thiserror.workspace = true
# A native Rust encoder and decoder of TOML-formatted files and streams. Provides implementations of the standard Serialize/Deserialize traits for...
toml.workspace = true
# Application-level tracing for Rust.
tracing.workspace = true

# Criterion is used only by the library's benchmark target.
[dev-dependencies]
# Measures Rust benchmark performance with statistical analysis and comparison reports.
criterion.workspace = true

[[bench]]
name = "greeting"
# Criterion supplies its own benchmark entry point instead of Rust's default harness.
harness = false

[lints]
# Apply the workspace's Rust, rustdoc, and Clippy rules to this crate.
workspace = true
