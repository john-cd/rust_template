# Docker Compose reference guide: https://docs.docker.com/go/compose-spec-reference/

# Require the generated or local project prefix so workspace paths and cache volumes agree.
name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME in .devcontainer/.env}

services:
  # Production-only runtime image; it is excluded when Compose loads the development override.
  production:
    profiles: [production]
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      target: production
      args:
        RUST_VERSION: ${RUST_VERSION:?Set RUST_VERSION in .devcontainer/.env}
        DEBIAN_VERSION: ${DEBIAN_VERSION:?Set DEBIAN_VERSION in .devcontainer/.env}
        CARGO_CHEF_VERSION: ${CARGO_CHEF_VERSION:?Set CARGO_CHEF_VERSION in .devcontainer/.env}
        CARGO_PACKAGE_NAME: ${CARGO_PACKAGE_NAME:?Set CARGO_PACKAGE_NAME in .devcontainer/.env}
