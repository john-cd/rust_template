# Project-scoped Compose stack: rust-template-prod.
# Build inputs come from tracked .devcontainer/.env; from the repo root pass --env-file .devcontainer/.env.
# Keep credentials in ignored .devcontainer/.env.local; from the repo root pass it as a second --env-file when present.
# TODO Reviewed ??-??-????
# Docker Compose reference guide: https://docs.docker.com/go/compose-spec-reference/

# Require the generated or local project prefix for consistent image names.
name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME in .devcontainer/.env}-prod
services:
  rust-template-app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      target: production
      args:
        RUST_VERSION: ${RUST_VERSION:?Set RUST_VERSION in .devcontainer/.env or the host environment}
        DEBIAN_VERSION: ${DEBIAN_VERSION:?Set DEBIAN_VERSION in .devcontainer/.env or the host environment}
        CARGO_BINSTALL_VERSION: ${CARGO_BINSTALL_VERSION:?Set CARGO_BINSTALL_VERSION in .devcontainer/.env or the host environment}
        CARGO_CHEF_VERSION: ${CARGO_CHEF_VERSION:?Set CARGO_CHEF_VERSION in .devcontainer/.env or the host environment}
        SCCACHE_VERSION: ${SCCACHE_VERSION:?Set SCCACHE_VERSION in .devcontainer/.env or the host environment}
        CARGO_PACKAGE_NAME: ${CARGO_PACKAGE_NAME:?Set CARGO_PACKAGE_NAME in .devcontainer/.env or the host environment}

        CARGO_DENY_VERSION: ${CARGO_DENY_VERSION:?Set CARGO_DENY_VERSION in .devcontainer/.env or the host environment}
        CARGO_LLVM_COV_VERSION: ${CARGO_LLVM_COV_VERSION:?Set CARGO_LLVM_COV_VERSION in .devcontainer/.env or the host environment}
        CARGO_MACHETE_VERSION: ${CARGO_MACHETE_VERSION:?Set CARGO_MACHETE_VERSION in .devcontainer/.env or the host environment}
        CARGO_MAKE_VERSION: ${CARGO_MAKE_VERSION:?Set CARGO_MAKE_VERSION in .devcontainer/.env or the host environment}
        CARGO_NEXTEST_VERSION: ${CARGO_NEXTEST_VERSION:?Set CARGO_NEXTEST_VERSION in .devcontainer/.env or the host environment}
        DPRINT_VERSION: ${DPRINT_VERSION:?Set DPRINT_VERSION in .devcontainer/.env or the host environment}
        LYCHEE_VERSION: ${LYCHEE_VERSION:?Set LYCHEE_VERSION in .devcontainer/.env or the host environment}
        RUSTFMT_VERSION: ${RUSTFMT_VERSION:?Set RUSTFMT_VERSION in .devcontainer/.env or the host environment}
        TYPOS_VERSION: ${TYPOS_VERSION:?Set TYPOS_VERSION in .devcontainer/.env or the host environment}
        ZIZMOR_VERSION: ${ZIZMOR_VERSION:?Set ZIZMOR_VERSION in .devcontainer/.env or the host environment}
        ZOLA_VERSION: ${ZOLA_VERSION:?Set ZOLA_VERSION in .devcontainer/.env or the host environment}